name: Platform Build and Test

on:
  workflow_call:
    inputs:
      platform:
        description: Platform release profile to run
        required: true
        type: string

jobs:
  windows:
    if: inputs.platform == 'windows'
    name: ${{ matrix.backend }} Release on Windows
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    strategy:
      fail-fast: false
      matrix:
        backend:
          - cpr
          - httplib

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: eb35a05cc21c69ec1399f7532b7dd61d271ac0d1
          path: vcpkg

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Read package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION).Trim()
          "WUWE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage Python outside runner reparse points
        shell: pwsh
        run: |
          $sourcePython = (Get-Command python.exe -ErrorAction Stop).Source
          $sourceHome = Split-Path -Parent $sourcePython
          $stagedHome = Join-Path $env:GITHUB_WORKSPACE ".ci-python"
          New-Item -ItemType Directory -Path $stagedHome -Force | Out-Null
          Get-ChildItem -LiteralPath $sourceHome -Force |
            Copy-Item -Destination $stagedHome -Recurse -Force
          $stagedPython = Join-Path $stagedHome "python.exe"
          & $stagedPython -c "import os, sys; print(os.path.realpath(sys.executable))"
          if ($LASTEXITCODE -ne 0) {
            throw "Staged Python failed to start: $stagedPython"
          }
          "WUWE_CI_PYTHON=$stagedPython" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-vcpkg `
            -DWUWE_HTTP_BACKEND=${{ matrix.backend }} `
            -DWUWE_ENABLE_STRICT_WARNINGS=ON `
            "-DPython3_EXECUTABLE=$env:WUWE_CI_PYTHON"

      - name: Build
        run: cmake --build --preset windows-vcpkg-release -- /m:1

      - name: Test
        run: ctest --preset windows-vcpkg-release

      - name: Install SDK
        if: matrix.backend == 'cpr'
        run: cmake --install build-vcpkg --config Release --prefix install-windows

      - name: Configure installed-package consumer
        if: matrix.backend == 'cpr'
        run: >-
          cmake -S tests/package_smoke -B build-package-smoke
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-windows
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build-vcpkg/vcpkg_installed

      - name: Build and run installed-package consumer
        if: matrix.backend == 'cpr'
        shell: pwsh
        run: |
          cmake --build build-package-smoke --config Release --parallel 1
          .\build-package-smoke\Release\wuwe_package_smoke.exe

      - name: Build Windows package
        if: matrix.backend == 'cpr'
        shell: pwsh
        run: >-
          .\tools\package-wuwe.ps1
          -BuildDir build-vcpkg
          -Configuration Release
          -SkipBuild

      - name: Inspect Windows package
        if: matrix.backend == 'cpr'
        shell: pwsh
        run: |
          $package = "dist/wuwe-$env:WUWE_VERSION-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Missing package: $package"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $package))
          try {
            if ($archive.Entries.Count -eq 0) { throw "Package is empty: $package" }
          }
          finally {
            $archive.Dispose()
          }

  linux:
    if: inputs.platform == 'linux'
    name: Release profile on Ubuntu 24.04
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: eb35a05cc21c69ec1399f7532b7dd61d271ac0d1
          path: vcpkg

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Read package version
        run: echo "WUWE_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Configure OpenSSL and SQLite release profile
        run: cmake --preset linux-vcpkg -DWUWE_ENABLE_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build --preset linux-vcpkg-release

      - name: Test
        run: ctest --preset linux-vcpkg-release

      - name: Install SDK
        run: cmake --install build-linux-vcpkg --prefix install-linux

      - name: Verify bundled Linux runtime
        run: |
          test -x install-linux/runtime/jre/bin/java
          test -f install-linux/runtime/tika/tika-server-standard.jar
          install-linux/runtime/jre/bin/java -version

      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/package_smoke -B build-package-smoke
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-linux
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build-linux-vcpkg/vcpkg_installed

      - name: Build and run installed-package consumer
        run: |
          cmake --build build-package-smoke --parallel 2
          ./build-package-smoke/wuwe_package_smoke

      - name: Build Linux package
        run: >-
          bash ./tools/package-wuwe.sh
          --build-dir build-linux-vcpkg
          --configuration Release
          --skip-build

      - name: Inspect Linux package
        run: |
          test -f "dist/wuwe-${WUWE_VERSION}-linux-x64.tar.gz"
          tar -tzf "dist/wuwe-${WUWE_VERSION}-linux-x64.tar.gz" >/dev/null

  macos:
    if: inputs.platform == 'macos'
    name: Release profile on ${{ matrix.os }} Apple Silicon
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: eb35a05cc21c69ec1399f7532b7dd61d271ac0d1
          path: vcpkg

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Read package version
        run: echo "WUWE_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          clang++ --version

      - name: Configure OpenSSL and SQLite release profile
        run: cmake --preset macos-arm64-vcpkg -DWUWE_ENABLE_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build --preset macos-arm64-vcpkg-release

      - name: Test
        run: >-
          env PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          ctest --preset macos-arm64-vcpkg-release

      - name: Install SDK
        if: matrix.os == 'macos-15'
        run: cmake --install build-macos-arm64-vcpkg --prefix install-macos

      - name: Verify bundled macOS runtime
        if: matrix.os == 'macos-15'
        run: |
          test -x install-macos/runtime/jre/Contents/Home/bin/java
          test -f install-macos/runtime/tika/tika-server-standard.jar
          codesign --verify --deep --strict install-macos/runtime/jre
          install-macos/runtime/jre/Contents/Home/bin/java -version

      - name: Configure installed-package consumer
        if: matrix.os == 'macos-15'
        run: >-
          cmake -S tests/package_smoke -B build-package-smoke
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-macos
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=arm64-osx-wuwe
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/vcpkg-triplets
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build-macos-arm64-vcpkg/vcpkg_installed

      - name: Build and run installed-package consumer
        if: matrix.os == 'macos-15'
        run: |
          cmake --build build-package-smoke --parallel 2
          env -i PATH=/usr/bin:/bin ./build-package-smoke/wuwe_package_smoke

      - name: Build macOS package
        if: matrix.os == 'macos-15'
        run: >-
          bash ./tools/package-wuwe.sh
          --build-dir build-macos-arm64-vcpkg
          --configuration Release
          --skip-build

      - name: Inspect macOS package
        if: matrix.os == 'macos-15'
        run: |
          test -f "dist/wuwe-${WUWE_VERSION}-macos-arm64.tar.gz"
          tar -tzf "dist/wuwe-${WUWE_VERSION}-macos-arm64.tar.gz" >/dev/null
          package_extract="$(mktemp -d)"
          tar -xzf "dist/wuwe-${WUWE_VERSION}-macos-arm64.tar.gz" -C "$package_extract"
          codesign --verify --deep --strict "$package_extract/runtime/jre"
          "$package_extract/runtime/jre/Contents/Home/bin/java" -version
